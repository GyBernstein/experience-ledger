services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?Required}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:?Required}
    volumes:
      - ledger-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-ledger.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
  application:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/ledger
      DB_USER: ledger_app
      DB_PASSWORD: ${LEDGER_APP_PASSWORD}
      DB_MIGRATION_USER: ledger_owner
      DB_MIGRATION_PASSWORD: ${LEDGER_OWNER_PASSWORD}
      LEDGER_PRINCIPALS: ${LEDGER_PRINCIPALS}
      LEDGER_WORKER_SPACES: ${LEDGER_WORKER_SPACES}
      LEDGER_EMBEDDING_PROVIDER: ${LEDGER_EMBEDDING_PROVIDER:-disabled}
      LEDGER_EMBEDDING_URL: ${LEDGER_EMBEDDING_URL:-}
      LEDGER_EMBEDDING_TOKEN: ${LEDGER_EMBEDDING_TOKEN:-}
      LEDGER_EMBEDDING_MODEL: ${LEDGER_EMBEDDING_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  test-db:
    image: pgvector/pgvector:0.8.2-pg16
    profiles: ["test"]
    environment:
      POSTGRES_DB: ledger_test
      POSTGRES_PASSWORD: test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /work
    volumes:
      - .:/work
      - maven-cache:/root/.m2
    environment:
      LEDGER_IT_URL: jdbc:postgresql://test-db:5432/ledger_test
      LEDGER_IT_ADMIN_USER: postgres
      LEDGER_IT_ADMIN_PASSWORD: test-only
    command: ["mvn", "-B", "verify"]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  ledger-data:
  maven-cache:
