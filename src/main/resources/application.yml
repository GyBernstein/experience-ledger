spring:
  application:
    name: experience-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    user: ${DB_MIGRATION_USER:ledger_owner}
    password: ${DB_MIGRATION_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
logging:
  level:
    root: INFO
    com.example.ledger: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
ledger:
  product-version: 1.2.0
  ai:
    enabled: ${LEDGER_AI_ENABLED:false}
    provider: ${LEDGER_AI_PROVIDER:local}
    url: ${LEDGER_AI_URL:}
    api-key: ${LEDGER_AI_API_KEY:}
    model: ${LEDGER_AI_MODEL:}
    temperature: ${LEDGER_AI_TEMPERATURE:0.2}
    retry:
      max-attempts: ${LEDGER_AI_MAX_ATTEMPTS:2}
    timeout:
      connect-seconds: ${LEDGER_AI_CONNECT_TIMEOUT_SECONDS:5}
      read-seconds: ${LEDGER_AI_READ_TIMEOUT_SECONDS:120}
  security:
    principals: ${LEDGER_PRINCIPALS:[]}
  worker:
    enabled: ${LEDGER_WORKER_ENABLED:true}
    spaces: ${LEDGER_WORKER_SPACES:}
    delay-ms: 3000
    max-attempts: 3
    lease-seconds: 120
  embedding:
    provider: ${LEDGER_EMBEDDING_PROVIDER:disabled}
    url: ${LEDGER_EMBEDDING_URL:}
    token: ${LEDGER_EMBEDDING_TOKEN:}
    model: ${LEDGER_EMBEDDING_MODEL:}
    timeout-seconds: 20
  retrieval:
    pool-size: 200
    lexical-weight: 1.0
    semantic-weight: 1.0
    context-weight: 0.3
    applicability-weight: 0.5
    confidence-weight: 0.1
