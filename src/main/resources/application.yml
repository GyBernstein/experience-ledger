spring:
  application:
    name: experience-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    user: ${DB_MIGRATION_USER:ledger_owner}
    password: ${DB_MIGRATION_PASSWORD:}
  jackson:
    use-jackson2-defaults: true
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
logging:
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
ledger:
  security:
    principals: ${LEDGER_PRINCIPALS:[]}
  worker:
    enabled: ${LEDGER_WORKER_ENABLED:true}
    spaces: ${LEDGER_WORKER_SPACES:}
    delay-ms: 3000
    max-attempts: 3
    lease-seconds: 120
  embedding:
    provider: ${LEDGER_EMBEDDING_PROVIDER:disabled}
    url: ${LEDGER_EMBEDDING_URL:}
    token: ${LEDGER_EMBEDDING_TOKEN:}
    model: ${LEDGER_EMBEDDING_MODEL:}
    timeout-seconds: 20
  retrieval:
    pool-size: 200
    lexical-weight: 1.0
    semantic-weight: 1.0
    context-weight: 0.3
    applicability-weight: 0.5
    confidence-weight: 0.1
