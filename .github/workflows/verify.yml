name: Verify Ledger V1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and native PostgreSQL integration tests
        run: mvn -B verify
      - name: Start Compose deployment
        run: |
          cp .env.example .env
          docker compose up -d --build
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://localhost:8080/actuator/health', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('Application health check failed')
          PY
      - name: Create demo space and exercise the public API
        env:
          LEDGER_TOKEN: local-human-token-change-me
        run: |
          docker compose exec -T db psql -U postgres -d ledger -v ON_ERROR_STOP=1 -v space_id=11111111-1111-1111-1111-111111111111 -v space_name=Demo < scripts/create-space.sql
          python3 scripts/seed_demo.py
      - name: Collect test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-test-reports
          path: |
            target/surefire-reports/*.txt
            target/failsafe-reports/*.txt
      - name: Deployment logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop temporary deployment
        if: always()
        run: docker compose down
