name: Verify Ledger V1.1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and native PostgreSQL integration tests
        run: mvn -B verify
      - name: Start Compose deployment
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://localhost:8080/actuator/health', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('Application health check failed')
          PY
      - name: Create demo space and exercise the public API
        env:
          LEDGER_TOKEN: local-human-token-change-me
        run: |
          docker compose -f docker-compose.yml -f docker-compose.frontend.yml exec -T db psql -U postgres -d ledger -v ON_ERROR_STOP=1 -v space_id=11111111-1111-1111-1111-111111111111 -v space_name=Demo < scripts/create-space.sql
          python3 scripts/seed_demo.py
      - name: Frontend client contract through Nginx
        env:
          LEDGER_TOKEN: local-human-token-change-me
          LEDGER_URL: http://localhost:3000
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/
          npm run test:api --prefix frontend
      - name: Agent context API contract
        env:
          LEDGER_TOKEN: local-human-token-change-me
          LEDGER_AGENT_TOKEN: local-agent-token-change-me
          LEDGER_URL: http://localhost:3000
        run: python3 scripts/agent_context_smoke.py
      - name: Human judgment and Agent sharing contract
        env:
          LEDGER_TOKEN: local-human-token-change-me
          LEDGER_AGENT_TOKEN: local-agent-token-change-me
          LEDGER_URL: http://localhost:3000
        working-directory: frontend
        run: node --import tsx tests/judgment-api-smoke.ts
      - name: Context database guards
        run: |
          { echo "SET ROLE ledger_app;"; cat scripts/context_db_checks.sql; } | docker compose exec -T db psql -U postgres -d ledger -v ON_ERROR_STOP=1
      - name: Collect test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-test-reports
          path: |
            target/surefire-reports/*.txt
            target/failsafe-reports/*.txt
      - name: Deployment logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.frontend.yml logs --no-color
      - name: Stop temporary deployment
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.frontend.yml down
